<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>仙女資源入口</title>
<meta name="description" content="仙女團隊常用工具，一個網址全部找得到">
<meta name="theme-color" content="#FCF9F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="仙女資源入口">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pearl:#FCF9F7;
    --paper:#FFFFFF;
    --champagne:#E4DCD3;
    --rose:#B4846F;
    --rose-deep:#9A6C58;
    --nude:#F1DFD8;
    --ink:#4A3E39;
    --ink-soft:#8A7B74;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"Noto Sans TC",system-ui,sans-serif;
    background:var(--pearl);
    color:var(--ink);
    line-height:1.6;
    min-height:100vh;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap{max-width:460px;margin:0 auto;padding:44px 20px 40px}

  /* ---------- 標頭 ---------- */
  header{text-align:center;margin-bottom:36px}
  .mark{
    width:160px;height:160px;margin:0 auto 8px;
    display:grid;place-items:center;overflow:hidden;
  }
  .mark img{width:100%;height:100%;object-fit:contain;transform:scale(1.3);mix-blend-mode:multiply}
  .mark span{font-family:"Noto Serif TC",serif;font-weight:700;font-size:15px;color:var(--rose);letter-spacing:.16em;padding-left:.16em}
  h1{
    font-family:"Noto Serif TC",serif;font-weight:700;
    font-size:28px;letter-spacing:.18em;color:var(--ink);
    padding-left:.18em;
  }
  .sub{margin-top:8px;font-size:14px;color:var(--ink-soft)}

  /* ---------- 分組 ---------- */
  .group{margin-top:28px}
  .group h2{
    font-size:13px;font-weight:500;color:var(--rose-deep);
    display:flex;align-items:center;gap:10px;margin:0 4px 10px;
  }
  .group h2::after{content:"";flex:1;height:1px;background:var(--champagne)}

  .list{
    background:var(--paper);border-radius:20px;
    border:1px solid var(--champagne);overflow:hidden;
  }
  .item{display:flex;align-items:center;border-top:1px solid #F1ECE7}
  .item:first-child{border-top:0}
  .open{
    flex:1;display:flex;align-items:center;gap:14px;
    padding:16px 6px 16px 16px;text-decoration:none;color:inherit;min-width:0;
  }
  .open:active{background:#FBF5F2}
  .glyph{
    flex:none;width:44px;height:44px;border-radius:14px;
    background:var(--nude);color:var(--rose-deep);
    display:grid;place-items:center;
  }
  .glyph svg{width:22px;height:22px}
  .txt{min-width:0}
  .name{font-size:16px;font-weight:700;color:var(--ink)}
  .desc{font-size:13px;color:var(--ink-soft);margin-top:1px}
  .tag{
    display:inline-block;margin-top:5px;font-size:12px;font-weight:500;
    padding:1px 9px;border-radius:99px;background:var(--rose);color:#fff;
  }
  .tag.soon{background:var(--nude);color:var(--rose-deep)}
  .tag.over{background:#EEE9E5;color:var(--ink-soft)}
  .tag.lock{background:#EFEAF4;color:#6F5E85}
  .item.vip .glyph{background:#EFEAF4;color:#A88A4E}

  .copy{
    flex:none;margin-right:12px;padding:8px 12px;border-radius:12px;
    border:1px solid var(--champagne);background:var(--pearl);
    font:inherit;font-size:13px;color:var(--rose-deep);cursor:pointer;
  }
  .copy:active{background:var(--nude)}

  .item.empty .open{pointer-events:none}
  .item.empty .name{color:var(--ink-soft)}
  .item.empty .glyph{background:#F3EFEC;color:#BBAFA8}
  .item.ended .glyph{background:#F3EFEC;color:#BBAFA8}

  /* ---------- 底部 ---------- */
  .tips{
    margin-top:32px;padding:16px 18px;border-radius:16px;
    background:transparent;border:1px dashed var(--champagne);
    font-size:13px;color:var(--ink-soft);
  }
  .tips b{color:var(--ink);font-weight:500}
  .share{
    display:block;width:100%;margin-top:14px;padding:14px;border:0;border-radius:16px;
    background:var(--rose);color:#fff;font:inherit;font-size:15px;font-weight:500;cursor:pointer;
  }
  .share:active{background:var(--rose-deep)}
  footer{margin-top:28px;text-align:center;font-size:12px;color:#B3A69F}

  .toast{
    position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));
    transform:translate(-50%,20px);opacity:0;pointer-events:none;
    background:var(--ink);color:#fff;font-size:14px;padding:10px 18px;border-radius:99px;
    transition:opacity .2s,transform .2s;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  button:focus-visible,a:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="mark"><img src="icon-512.png" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'FAIRY'}))"></div>
    <h1>仙女資源入口</h1>
    <p class="sub">團隊常用的工具都在這裡，收藏這一個網址就好</p>
  </header>

  <main id="app"></main>

  <div class="tips">
    <b>加到手機主畫面，下次一點就開</b><br>
    iPhone：Safari 下方「分享」→「加入主畫面」<br>
    Android：Chrome 右上「⋮」→「加到主畫面」
  </div>
  <button class="share" id="shareBtn">分享入口給夥伴</button>

  <footer>仙女團隊專屬資源｜巧穎開發</footer>
</div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   ✏️ 只要改這裡：網址貼在 url 的引號裡面
   url 空白的話，會顯示「連結準備中」
   要新增工具，複製一整段 { ... }, 貼在下面就好
   ========================================================= */
const TOOLS = [
  {
    group: "每天經營",
    name: "30天經營導航",
    desc: "健檢、定位、每天 3 件事",
    icon: "compass",
    url: "https://iammegan418-design.github.io/fairy-30days/"
  },
  {
    group: "每天經營",
    name: "仙女陪跑打卡牆",
    desc: "加入陪跑群組，每天公開打卡",
    icon: "check",
    url: "https://iammegan418-design.github.io/fairy-checkin/"
  },
  {
    group: "每天經營",
    name: "仙女獲利手帳",
    desc: "記錄營收成本，看見每月獲利",
    icon: "book",
    badge: "入門版・免登入就能記",
    url: "https://fairy-profit-journal.netlify.app/"
  },
  {
    group: "每天經營",
    name: "仙女小金庫",
    desc: "進銷存加月報，一次管好",
    icon: "vault",
    badge: "專業版・雲端帳號同步",
    url: "https://yucni20.github.io/FairyLittleTreasury/"
  },
  {
    group: "限時活動",
    name: "2026 中秋組合速算",
    desc: "客人報價、叫貨、加盟試算",
    icon: "moon",
    url: "https://iammegan418-design.github.io/fairy-moon/",
    start: "2026-09-17",
    end: "2026-10-05"
  },
  {
    group: "高階夥伴專區",
    name: "仙女皇家 一級獲利",
    desc: "利潤差、組織獎金、獲利曲線",
    icon: "crown",
    badge: "一級・皇家專用・需密碼",
    vip: true,
    url: "https://iammegan418-design.github.io/fairy-royal-profit/"
  }
];

/* ---------- 以下不用改 ---------- */
const ICONS = {
  compass:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5.5A1.5 1.5 0 0 1 6.5 4H19v14H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19"/><path d="m9 13 2.5-2.5 2 2L16 10"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>',
  vault:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="3"/><circle cx="12" cy="12" r="3"/><path d="M12 9v.01M15 12h.01M7 19v1.5M17 19v1.5"/></svg>',
  crown:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8l4 4 4-6 4 6 4-4-1.5 10h-13z"/><path d="M6.5 21h11"/></svg>',
  link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>'
};

function day(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function md(s){const d=day(s);return (d.getMonth()+1)+"/"+d.getDate()}

function status(t){
  if(!t.start||!t.end) return null;
  const today=new Date();today.setHours(0,0,0,0);
  const s=day(t.start), e=day(t.end);
  if(today<s){
    const n=Math.round((s-today)/864e5);
    return {cls:"soon",text:`${md(t.start)} 開跑・還有 ${n} 天`,ended:false};
  }
  if(today>e) return {cls:"over",text:"活動已結束",ended:true};
  const left=Math.round((e-today)/864e5);
  return {cls:"",text:left===0?"今天最後一天":`進行中・到 ${md(t.end)}`,ended:false};
}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function render(){
  const app=document.getElementById("app");
  const groups=[...new Set(TOOLS.map(t=>t.group))];
  app.innerHTML=groups.map(g=>{
    const rows=TOOLS.filter(t=>t.group===g)
      .map(t=>({t,st:status(t)}))
      .sort((a,b)=>(a.st?.ended?1:0)-(b.st?.ended?1:0))
      .map(({t,st})=>{
        const has=!!t.url.trim();
        const cls=["item",has?"":"empty",st?.ended?"ended":"",t.vip?"vip":""].join(" ");
        const tag=!has?'<span class="tag over">連結準備中</span>'
                 :st?`<span class="tag ${st.cls}">${st.text}</span>`
                 :t.badge?`<span class="tag ${t.vip?"lock":"soon"}">${esc(t.badge)}</span>`:"";
        return `<div class="${cls}">
          <a class="open" ${has?`href="${esc(t.url)}"`:""}>
            <span class="glyph">${ICONS[t.icon]||ICONS.link}</span>
            <span class="txt">
              <span class="name">${esc(t.name)}</span>
              <span class="desc" style="display:block">${esc(t.desc)}</span>
              ${tag}
            </span>
          </a>
          ${has?`<button class="copy" data-url="${esc(t.url)}" data-name="${esc(t.name)}">複製</button>`:""}
        </div>`;
      }).join("");
    return `<section class="group"><h2>${esc(g)}</h2><div class="list">${rows}</div></section>`;
  }).join("");
}

function toast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg;el.classList.add("show");
  clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),1800);
}

async function copyText(text){
  try{await navigator.clipboard.writeText(text);return true}
  catch{
    const ta=document.createElement("textarea");ta.value=text;
    ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);
    ta.select();const ok=document.execCommand("copy");ta.remove();return ok;
  }
}

document.addEventListener("click",async e=>{
  const b=e.target.closest(".copy");
  if(!b) return;
  const ok=await copyText(`${b.dataset.name}\n${b.dataset.url}`);
  toast(ok?`已複製「${b.dataset.name}」`:"複製失敗，請長按連結複製");
});

document.getElementById("shareBtn").addEventListener("click",async()=>{
  const url=location.href.split("#")[0];
  const text="仙女團隊的工具都在這個入口，加到手機主畫面最方便 🌙";
  if(navigator.share){
    try{await navigator.share({title:"仙女資源入口",text,url})}catch{}
  }else{
    const ok=await copyText(`${text}\n${url}`);
    toast(ok?"入口網址已複製":"複製失敗，請直接複製網址列");
  }
});

render();
</script>
</body>
</html>
